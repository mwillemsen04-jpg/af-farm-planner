<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--brass:#d4a640;--ink:#e8edf3;--panel:#121821e8}

canvas{touch-action:none}

#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#16303f,#08111a 70%);z-index:10;transition:opacity .6s}

#chip{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid #ffffff22;box-shadow:0 6px 18px #0008;backdrop-filter:blur(6px)}
#chip b{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
#chip span{font-size:11px;opacity:.75}
#ctl{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#ctl button{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff26;background:var(--panel);color:var(--ink);font:700 14px system-ui;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0007;cursor:pointer;padding:0}
#ctl button[aria-pressed=false]{opacity:.45}
#ctl button:active{transform:scale(.94)}
#hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:var(--panel);border:1px solid #ffffff22;font-size:12px;white-space:nowrap;transition:opacity .8s;pointer-events:none}
@media (max-width:700px),(pointer:coarse){#chip{padding:6px 10px;border-radius:10px}#chip b{font-size:10px}#chip span{font-size:10px}#ctl{gap:6px}#ctl button{width:40px;height:40px;border-radius:11px}#hint{font-size:11px;bottom:auto;top:max(64px,calc(env(safe-area-inset-top) + 56px))}}

#tlb{position:fixed;left:max(12px,env(safe-area-inset-left));right:calc(max(12px,env(safe-area-inset-right)) + 56px);bottom:max(12px,env(safe-area-inset-bottom));max-width:620px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid #ffffff22;box-shadow:0 6px 18px #0008;display:flex;flex-direction:column;gap:6px;z-index:5}
#tlb[hidden]{display:none}
#tlb .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tlb button,#tlb select{height:32px;border-radius:9px;border:1px solid #ffffff26;background:#ffffff10;color:var(--ink);font:700 12px system-ui;padding:0 9px;cursor:pointer}
#tlb #tPlay{width:36px;border-radius:50%;background:var(--brass);color:#141414;border-color:var(--brass);font-size:14px;padding:0}
#tlb button.on{background:var(--brass);color:#141414}

#tTime{font:700 13px ui-monospace,Menlo,monospace;margin-left:auto;white-space:nowrap}
#tRng{width:100%;accent-color:var(--brass);margin:0;height:28px;touch-action:pan-y}
#tSpd{min-width:56px}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,#0007 100%)}
