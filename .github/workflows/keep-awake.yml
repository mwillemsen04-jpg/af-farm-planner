# Pings the backend every few minutes so the free Render service never sleeps
# (no 30-60s cold start). Public repo => Actions minutes are free.
name: keep-backend-awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping backend health
        run: curl -fsS --max-time 90 https://af-farm-backend.onrender.com/healthz || true
